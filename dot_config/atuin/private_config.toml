# Active settings only — everything else stays at atuin's defaults.
# Regenerate the fully annotated stock template with `atuin default-config`.
enter_accept = true
search_mode = "daemon-fuzzy"
keymap_mode = "vim-insert"

[sync]
records = true

[daemon]
enabled = true
autostart = true

[keymap.vim-normal]
"j" = "cursor-left"
"k" = "select-next"
"l" = "select-previous"
";" = "cursor-right"
