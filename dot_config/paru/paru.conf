# paru configuration. This file *replaces* /etc/paru.conf (paru stops looking
# once $XDG_CONFIG_HOME/paru/paru.conf exists), so the system defaults that
# matter are restated here. Reference: paru.conf(5)
# Note: paru.conf allows no trailing comments — options are bare tokens.

[options]
# --- AUR resolution ------------------------------------------------------
# import unknown PGP keys from validpgpkeys
PgpFetch
# track -git/-svn/... packages on -Syu
Devel
# resolve AUR virtual packages (asks when ambiguous)
Provides

# --- interaction ---------------------------------------------------------
# keep sudo alive through long builds
SudoLoop
# repo + AUR in one transaction, one menu
CombinedUpgrade
# VerbosePkgLists-style list; skip individual AUR updates
UpgradeMenu
NewsOnUpgrade
# let pacman's --ask confirm conflicts
UseAsk

# --- building ------------------------------------------------------------
# stop at the first AUR package that fails to build
FailFast
# build the batch, then install it in one go
BatchInstall
# drop makedepends once they are no longer needed
RemoveMake
# remove untracked build leftovers (keeps VCS clones)
CleanAfter

# --- review --------------------------------------------------------------
# No interactive PKGBUILD review: the prompt before every AUR build is noise,
# and it is not what actually catches a compromised upload.
SkipReview

# Instead, refuse AUR packages whose AUR entry changed in the last day. A
# hijacked maintainer account or malicious upload is normally reported and
# pulled within hours, so this window is the real protection that manual
# review gives. Devel packages (-git, -svn, ...) are exempt; override a single
# run with --nominimumreleaseage.
MinimumReleaseAge = 1d
