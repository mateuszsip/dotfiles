# TEMP(hyprlua): replaced by base/bindings/media.lua; remove this file at phase 7.
# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, sys-osd --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, sys-osd --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, sys-osd --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, sys-audio input-mute
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, sys-brightness +5%
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, sys-brightness 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, sys-brightness 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, sys-brightness 1%
bindeld = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, sys-brightness --keyboard up
bindeld = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, sys-brightness --keyboard down
bindld = ,XF86KbdLightOnOff, Keyboard backlight cycle, exec, sys-brightness --keyboard cycle
bindld = ,XF86TouchpadToggle, Toggle touchpad, exec, sys-touchpad
bindld = ,XF86TouchpadOn, Enable touchpad, exec, sys-touchpad on
bindld = ,XF86TouchpadOff, Disable touchpad, exec, sys-touchpad off

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, sys-osd --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, sys-osd --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, sys-brightness +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, sys-brightness 1%-

# Requires playerctl
bindld = , XF86AudioNext, Next track, exec, sys-osd --playerctl next
bindld = , XF86AudioPause, Pause, exec, sys-osd --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, sys-osd --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, sys-osd --playerctl previous

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, sys-audio output-switch
