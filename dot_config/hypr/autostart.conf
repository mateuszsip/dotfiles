# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = systemd-run --user --no-block bash ~/.config/waybar/ai-workspace-watcher.sh
exec-once = systemd-run --user --no-block bash ~/.config/waybar/notification-watcher.sh
exec-once = uwsm-app -- zen-browser
#exec-once = uwsm-app -- bitwarden-desktop
exec-once = [workspace 2 silent] ghostty
exec-once = [workspace 3 silent] ghostty --working-directory=~/.local/share/chezmoi

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

