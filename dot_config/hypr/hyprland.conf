# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Base config (vendored from Omarchy 3.8.5, now owned here)
source = ~/.config/hypr/base/autostart.conf
source = ~/.config/hypr/base/bindings/media.conf
source = ~/.config/hypr/base/bindings/clipboard.conf
source = ~/.config/hypr/base/bindings/tiling-v2.conf
source = ~/.config/hypr/base/bindings/utilities.conf
source = ~/.config/hypr/base/envs.conf
source = ~/.config/hypr/base/looknfeel.conf
source = ~/.config/hypr/base/input.conf
source = ~/.config/hypr/base/windows.conf
# Theme colors (generated from .chezmoidata/palette.toml)
source = ~/.config/hypr/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# App workspace assignments
windowrule = workspace 1 silent, match:class zen
windowrule = workspace 5 silent, match:class (BambuStudio|bambu-studio)
windowrule = workspace 7 silent, match:class steam
windowrule = workspace 4 silent, match:class chrome-web.whatsapp.com__-Profile_1
windowrule = workspace 9 silent, match:class feishin
windowrule = workspace 10 silent, match:class Bitwarden
windowrule = float off, match:class Bitwarden

# Toggle config flags dynamically (written by sys-window / sys-monitor)
source = ~/.local/state/hypr/toggles/*.conf
