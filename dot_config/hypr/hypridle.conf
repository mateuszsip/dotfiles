general {
    lock_cmd = pidof hyprlock || hyprlock                 # lock the screen
    before_sleep_cmd = SYS_LOCK_ONLY=true sys-lock        # lock before suspend, the compositor handles the display
    after_sleep_cmd = sleep 1 && sys-wake                 # delay for PAM readiness, then turn on display
    inhibit_sleep = 3                                     # wait until screen is locked
}

# Lock after 2.5 minutes idle
listener {
    timeout = 150
    on-timeout = sys-lock
    on-resume = sys-wake
}
